
name: Build Bestboy Sounds APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android SDK..."
          echo "ANDROID_HOME=${ANDROID_HOME:-not set}"

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ERROR: Android SDK path not found."
            exit 1
          fi

          SDKMANAGER="$(command -v sdkmanager)"

          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" --licenses || true

          echo "Installing Android 35 packages..."
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          elif [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' | head -n 1 || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project or ZIP file found."
              exit 1
            fi

            echo "Extracting: $ZIP_FILE"
            mkdir -p "$RUNNER_TEMP/bestboy-source"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/bestboy-source"

            PROJECT_SETTINGS="$(find "$RUNNER_TEMP/bestboy-source" -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1 || true)"

            if [ -z "$PROJECT_SETTINGS" ]; then
              echo "ERROR: settings.gradle file not found in ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          echo "Project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -O "$RUNNER_TEMP/gradle-8.9-bin.zip"

          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"

          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version

      - name: Build Bestboy Sounds APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking project files..."
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Starting APK compilation..."

          "$RUNNER_TEMP/gradle-8.9/bin/gradle" \
            --no-daemon \
            --stacktrace \
            -p "$PROJECT_DIR" \
            :app:assembleDebug

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated."
          ls -lh "$APK"

      - name: Upload Bestboy Sounds APK
        uses: actions/upload-artifact@v4
        with:
          name: Bestboy-Sounds-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
