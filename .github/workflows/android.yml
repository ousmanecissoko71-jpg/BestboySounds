
name: Build Bestboy Sounds APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Compile Bestboy Sounds
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No project ZIP found."
              exit 1
            fi

            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d extracted

            SETTINGS=$(find extracted -type f -name settings.gradle.kts | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: settings.gradle.kts not found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

          /tmp/gradle-8.9/bin/gradle --version

      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking project files..."

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Project structure OK."

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -euo pipefail

          /tmp/gradle-8.9/bin/gradle \
            --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK missing or empty."
            exit 1
          fi

          ls -lh "$APK"
          echo "APK successfully generated."

      - name: Upload Bestboy Sounds APK
        uses: actions/upload-artifact@v4
        with:
          name: Bestboy-Sounds-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
