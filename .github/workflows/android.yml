
name: Build Bestboy Sounds APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Compile Bestboy Sounds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project ZIP found."
              exit 1
            fi

            echo "Extracting $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d extracted

            SETTINGS=$(find extracted -type f -name settings.gradle.kts | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: settings.gradle.kts missing."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=$(command -v sdkmanager)

          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" --licenses || true

          echo "Installing Android SDK 35..."
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

          /tmp/gradle-8.9/bin/gradle --version

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android files..."

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Android project structure OK."

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -euo pipefail

          /tmp/gradle-8.9/bin/gradle \
            --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug \
            --stacktrace

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload Bestboy Sounds APK
        uses: actions/upload-artifact@v4
        with:
          name: Bestboy-Sounds-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
