
name: Build Bestboy Sounds APK

on:
  workflow_dispatch:
  push:
    branches: [main, principal]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          WRAPPER=$(find extracted -name gradlew -type f | head -n 1)
          test -n "$WRAPPER"
          PROJECT_DIR=$(dirname "$WRAPPER")
          chmod +x "$WRAPPER"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bestboy-Sounds-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
