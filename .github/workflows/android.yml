
name: Build Bestboy Sounds APK

on:
  workflow_dispatch:
  push:
    branches: [main, principal]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR: Aucun ZIP trouve a la racine."
            exit 1
          fi

          echo "Archive trouvee: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(find extracted -type f -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERREUR: settings.gradle.kts introuvable."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERREUR: configuration app/build.gradle.kts introuvable."
            exit 1
          fi

          echo "Projet Android: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e
          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --version

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          /tmp/gradle-8.7/bin/gradle \
            --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bestboy-Sounds-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
